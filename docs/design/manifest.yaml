          concept: item_type
          not: [vault_owner]
          example: "Login"
        states:
          - { id: default }
          - { id: disabled, copy: "nach dem Anlegen fest" }
        locators:
          web: "[data-ui-id='UI-VAULT-DIALOG-TYPE']"

      - id: UI-VAULT-DIALOG-OWNER
        type: field
        label: Besitzer
        status: required
        verify: required
        data_source: "Persönlich (mit vault.use) und Organisationen mit vault.manage"
        semantic_anchor:
          means: Wem der Eintrag gehört — dem eigenen Konto oder einer Organisation. Nur beim Anlegen wählbar.
          concept: vault_owner
          not: [vault_binding, server_folder]
          example: "Homelab"
        states:
          - { id: default }
          - { id: disabled, copy: "nach dem Anlegen fest" }
        locators:
          web: "[data-ui-id='UI-VAULT-DIALOG-OWNER']"

      - id: UI-VAULT-DIALOG-FIELDS
        type: form
        label: Angaben
        status: required
        verify: required
        data_source: "fields je Typ"
        semantic_anchor:
          means: Name, Beschreibung und die nicht geheimen Angaben des gewählten Typs. Der Name ist die Kennung für Agenten, Kleinbuchstaben, Ziffern, Punkt, Bindestrich und Unterstrich.
          concept: vault_item_fields
          not: [vault_secret]
          example: "portal-login · Benutzer ma.backes · Ursprung https://portal.example.com"
        states:
          - { id: default }
          - { id: error, copy: "Name schon vergeben." }
        locators:
          web: "[data-ui-id='UI-VAULT-DIALOG-FIELDS']"

      - id: UI-VAULT-DIALOG-SECRET
        type: field
        label: Geheimer Wert
        status: required
        verify: required
        data_source: "nur Eingabe; gespeicherte Werte gehen nie an den Client"
        semantic_anchor:
          means: Eingabe der geheimen Felder des Typs. Beim Bearbeiten leer mit dem Hinweis, dass ein Wert gespeichert ist und leer lassen ihn behält.
          concept: vault_secret
          not: [vault_item_fields]
          example: "Passwort (gespeichert — leer lassen, um beizubehalten)"
        states:
          - { id: default }
          - { id: partial, copy: "gespeichert — leer lassen, um beizubehalten" }
          - { id: error, copy: "Wert fehlt." }
          - { id: empty, copy: "Ziel geändert — gespeicherte Werte werden verworfen. Neu eingeben." }
        locators:
          web: "[data-ui-id='UI-VAULT-DIALOG-SECRET']"

      - id: UI-VAULT-DIALOG-SCOPE
        type: field
        label: Gilt für
        status: required
        verify: required
        data_source: "Server und Ordner des Besitzers, Tags des Kontos (nur persönlich)"
        semantic_anchor:
          means: Auswahl, auf welchen Servern Agenten den Eintrag sehen — Server, Ordner (mit Unterordnern), Tags nur bei persönlichen Einträgen, oder Alle Server. Standard keine Auswahl.
          concept: vault_binding
          not: [vault_owner, permission]
          cardinality: many
          example: "Ordner Produktion · Server nas"
        states:
          - { id: default }
          - { id: empty, copy: "Für keinen Server freigegeben." }
          - { id: selected, copy: "Alle Server" }
        locators:
          web: "[data-ui-id='UI-VAULT-DIALOG-SCOPE']"

      - id: UI-VAULT-DIALOG-APPROVAL
        type: toggle
        label: Freigabe erforderlich
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: Jede Nutzung durch einen Agenten muss im Outpost-Fenster bestätigt werden. Standard an.
          concept: approval_policy
        states:
          - { id: default }
          - { id: selected }
        locators:
          web: "[data-ui-id='UI-VAULT-DIALOG-APPROVAL']"

      - id: UI-VAULT-DIALOG-SAVE
        type: action
        label: Speichern
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: Legt den Eintrag an bzw. speichert Änderungen und schließt den Dialog; Beschriftung Erstellen beim Anlegen.
        states:
          - { id: default }
          - { id: disabled }
          - { id: loading, copy: "Speichere …" }
          - { id: error, copy: "Speichern fehlgeschlagen." }
        locators:
          web: "[data-ui-id='UI-VAULT-DIALOG-SAVE']"

  - id: UI-AGENT-ACCESS
    kind: dialog
    title: Agenten-Zugang
    artboard: docs/design/mockups/ui-agent-access.html
    guide: docs/design/guides/ui-agent-access.md
    presentation: { over: UI-SERVERS, trigger: "Kontextmenü Server › Agenten-Zugang… (nur SSH); Bearbeiten in UI-API-KEYS-AGENTS", size: "mittig, 40rem, max 85vh", dismiss: "Esc, Backdrop, Schließen — nicht während der Einrichtung läuft", keyboard: "Ctrl+Enter Einrichten" }
    description: Richtet Claude Code und Codex auf diesem Server für den Outpost-MCP ein und zeigt, welche Agenten schon Zugang haben.
    elements:
      - id: UI-AGENT-ACCESS-KEYS
        type: list
        label: Agenten auf diesem Server
        status: required
        verify: required
        data_source: "GET /api/vault/agent-keys?entryId="
        semantic_anchor:
          means: Die Agenten-Keys dieses Servers — Agent, angelegt, zuletzt genutzt, IP-Bindung — je mit Entziehen. Entziehen widerruft den Key und entfernt die Registrierung auf dem Server.
          concept: agent_key
          aliases: [agent_token, mcp_key]
          not: [api_key, vault_item, identity]
          cardinality: many
          example: "Claude Code · angelegt 09.10. · zuletzt vor 5 Min. · nur 192.168.2.40"
          empty_means: Kein Agent hat auf diesem Server Zugang.
        states:
          - { id: default }
          - { id: empty, copy: "Noch kein Agent auf diesem Server eingerichtet." }
          - { id: loading }
          - { id: selected, copy: "Zugang von Claude Code auf web01 entziehen? Der Agent verliert sofort den Zugriff." }
          - { id: error, copy: "Entziehen fehlgeschlagen." }
          - { id: partial, copy: "Zugang entzogen. Die Registrierung auf web01 trägt den Key eines anderen Kontos und bleibt stehen." }
          - { id: disabled, copy: "Zugang entzogen. Die Registrierung konnte nicht entfernt werden — Befehl kopieren und auf dem Server ausführen." }
        locators:
          web: "[data-ui-id='UI-AGENT-ACCESS-KEYS']"

      - id: UI-AGENT-ACCESS-SETUP
        type: form
        label: Einrichten
        status: required
        verify: required
        data_source: "Auswahl Claude Code / Codex, IP-Bindung, zusätzliche Adressbereiche"
        semantic_anchor:
          means: Welche Agenten eingerichtet werden (Claude Code, Codex) und welche zusätzlichen Adressbereiche (CIDR) ihr Key neben der IP dieses Servers akzeptiert.
          concept: agent_key
          not: [api_key, vault_binding]
          example: "Claude Code ✓ · Codex ✓ · 10.0.0.0/24"
        states:
          - { id: default }
          - { id: loading, copy: "Richte ein …" }
          - { id: error, copy: "Ungültiger Adressbereich." }
          - { id: disabled, copy: "Outpost-Adresse für Agenten fehlt — in Einstellungen › Vault setzen." }
          - { id: partial, copy: "Für root auf web01 hat bereits ein anderes Konto Agenten-Zugang eingerichtet — die Registrierung wird ersetzt." }
        locators:
          web: "[data-ui-id='UI-AGENT-ACCESS-SETUP']"

      - id: UI-AGENT-ACCESS-IPBIND
        type: toggle
        label: Nur von der IP dieses Servers
        status: required
        verify: required
        data_source: "aufgelöste Adresse des Server-Eintrags"
        semantic_anchor:
          means: Ob der Key nur Anfragen von der Adresse dieses Servers (plus den eingetragenen Adressbereichen) akzeptiert. Standard an; aus heißt von überall.
          concept: ip_binding
          not: [vault_binding, allowed_origin]
          example: "an · 192.168.2.40"
        states:
          - { id: default }
          - { id: selected, copy: "aus — von überall" }
          - { id: partial, copy: "Gesehen wurde 172.17.0.1 statt 192.168.2.40 — als Adressbereich übernehmen? Ohne Übernahme weist Outpost den Key ab." }
          - { id: disabled, copy: "Adresse konnte nicht gemessen werden — der Key gilt für die aufgelöste Adresse des Servers." }
          - { id: error, copy: "TRUST_PROXY=true — die IP-Bindung ist wirkungslos." }
        locators:
          web: "[data-ui-id='UI-AGENT-ACCESS-IPBIND']"

      - id: UI-AGENT-ACCESS-RESULT
        type: feedback
        label: Ergebnis
        status: required
        verify: required
        data_source: "Antwort von POST /api/vault/agent-keys"
        semantic_anchor:
          means: >
            Je Agent das Ergebnis der Einrichtung — eingerichtet, oder der fertige Befehl zum
            Kopieren, wenn die automatische Einrichtung scheiterte (CLI fehlt, Exec-Fehler).
            Der Key ist nur hier und nur jetzt sichtbar; ein Key, der weder automatisch eingerichtet noch kopiert wurde, wird beim Schließen gelöscht.
          concept: agent_setup_result
          not: [agent_key, toast]
          example: "Claude Code eingerichtet · Codex: codex nicht gefunden — Befehl kopieren"
        states:
          - { id: default }
          - { id: empty, copy: "erscheint erst nach dem Einrichten" }
          - { id: success, copy: "Eingerichtet für root. Claude Code neu starten, dann /mcp." }
          - { id: partial, copy: "Bestehende Registrierung ersetzt — der alte Konto-Key bleibt gültig, bis du ihn unter API-Schlüssel löschst." }
          - { id: error, copy: "codex nicht gefunden. Befehl kopieren und auf dem Server ausführen." }
        locators:
          web: "[data-ui-id='UI-AGENT-ACCESS-RESULT']"

  - id: UI-VAULT-SETTINGS
    kind: panel
    title: Einstellungen › Vault
    artboard: docs/design/mockups/ui-vault-settings.html
    guide: docs/design/guides/ui-vault-settings.md
    presentation: { over: UI-SHELL, trigger: "Konto › Einstellungen › Vault (Recht settings.vault)", size: "Einstellungsfläche", dismiss: "Einstellungen schließen" }
    description: Systemeinstellungen des Vaults.
    elements:
      - id: UI-VAULT-SETTINGS-KEY
        type: status
        label: Vault-Schlüssel
        status: required
        verify: required
        data_source: "Prüfung von VAULT_KEY beim Start"
        semantic_anchor:
          means: Ob der Vault läuft — Schlüssel aktiv, fehlt (Vault aus) oder passt nicht zu den gespeicherten Daten (Vault aus). Bei fehlendem Schlüssel ein Satz, wie man VAULT_KEY setzt.
          concept: vault_key_status
          not: [encryption_key, api_key]
          example: "Aktiv"
        states:
          - { id: default, copy: "Aktiv" }
          - { id: disabled, copy: "Fehlt — VAULT_KEY fehlt — der Vault ist aus. Schlüssel als Umgebungsvariable oder Docker-Secret vault_key setzen." }
          - { id: error, copy: "Passt nicht — VAULT_KEY passt nicht zu den gespeicherten Einträgen — der Vault ist aus." }
        locators:
          web: "[data-ui-id='UI-VAULT-SETTINGS-KEY']"

      - id: UI-VAULT-SETTINGS-URL
        type: field
        label: Outpost-Adresse für Agenten
        status: required
        verify: required
        data_source: "Einstellung vault.agentUrl"
        semantic_anchor:
          means: Die Adresse, unter der Server Outpost erreichen; daraus entsteht die MCP-URL, die beim Einrichten eines Agenten eingetragen wird.
          concept: agent_base_url
          not: [browser_launcher_url]
          example: "http://192.168.2.10:6989"
        states:
          - { id: default }
          - { id: error, copy: "Keine gültige http- oder https-Adresse." }
        locators:
          web: "[data-ui-id='UI-VAULT-SETTINGS-URL']"

      - id: UI-VAULT-SETTINGS-PROXY
        type: feedback
        label: Hinweis Reverse-Proxy
        status: required
        verify: required
        data_source: "Einstellung TRUST_PROXY des Servers"
        semantic_anchor:
          means: Warnt, wenn Outpost jedem X-Forwarded-For glaubt (TRUST_PROXY=true) — dann ist die IP-Bindung von Agenten-Keys wirkungslos. Sonst nicht sichtbar.
          concept: proxy_trust_warning
          not: [vault_key_status, agent_base_url]
        states:
          - { id: default, copy: "nicht sichtbar" }
          - { id: error, copy: "TRUST_PROXY=true — Outpost glaubt jedem X-Forwarded-For, die IP-Bindung von Agenten-Keys ist wirkungslos. Hop-Zahl oder Adressliste setzen." }
        locators:
          web: "[data-ui-id='UI-VAULT-SETTINGS-PROXY']"

      - id: UI-VAULT-SETTINGS-SAVE
        type: action
        label: Einstellungen speichern
        status: required
        verify: recommended
        data_source: static
        semantic_anchor:
          means: Speichert die Outpost-Adresse für Agenten, wie der Speichern-Knopf der Browser-Einstellungen.
        states:
          - { id: default }
          - { id: disabled }
        locators:
          web: "[data-ui-id='UI-VAULT-SETTINGS-SAVE']"

