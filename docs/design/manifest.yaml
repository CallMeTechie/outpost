schema: mockingbird/1
project: outpost
revision: 2
updated: 2026-09-07
design_system: docs/design/design-system.md
mockups_index: docs/design/mockups/index.html
tokens_css: docs/design/mockups/tokens.css
token_definitions: [client/src/common/styles/_colors.sass, client/src/common/styles/_tokens.sass]
source_roots: [client/src]

changelog:
  - rev: 1
    date: 2026-09-03
    summary: Runde 1 — Servers-Arbeitsfläche und drei Dialoge, Bestand festgeschrieben, Fokus-Modus neu
    touched: [UI-SERVERS, UI-SERVER-DIALOG, UI-TMUX-DIALOG, UI-DIRECT-CONNECT]
  - rev: 2
    date: 2026-09-07
    summary: Runde 2 — Shell-Navigation erstmals gestaltet; Tab-Markierung und Tab-Beschriftung nachgetragen, die im Code entstanden waren
    touched: [UI-SHELL, UI-SERVERS-TAB-MARKER, UI-SERVERS-TAB-LABEL]

adapters:
  web: { locator: attribute, attribute: data-ui-id, visual_check: false }
primary_adapter: web

screens:
  - id: UI-SHELL
    kind: shared
    title: Rahmen — Navigation
    artboard: docs/design/mockups/ui-shell.html
    guide: docs/design/guides/ui-shell.md
    presentation: { keyboard: "Tab-Reihenfolge Logo → Navigation → Konto; Enter und Leertaste holen die eingeklappte Leiste zurück" }
    description: Die Navigation, die jede Seite umgibt — als Leiste links, unter 768px als Leiste unten.
    elements:
      - id: UI-SHELL-LOGO
        type: media
        label: Outpost
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: Die Bildmarke, zugleich der Schalter, der die Leiste ein- und ausklappt. Vier Pfosten unterschiedlicher Höhe, der letzte in der Erfolgsfarbe.
          example: "42px im Kopf der Leiste"
        states:
          - { id: default }
          - { id: selected, copy: "eingeklappt — die Leiste ist verborgen" }
        locators:
          web: "[data-ui-id='UI-SHELL-LOGO']"

      - id: UI-SHELL-NAV
        type: nav
        label: Bereiche
        status: required
        verify: required
        data_source: "getSidebarNavigation(t), gefiltert nach den Rechten des Kontos"
        semantic_anchor:
          means: Die Bereiche der Anwendung — Server, Monitoring, Snippets, Audit. Ein Eintrag je Bereich, der aktive hervorgehoben; Audit nur mit dem Recht dafür.
          concept: app_section
          aliases: [area, page, route]
          not: [server_entry, session]
          cardinality: many
          example: "Server · Monitoring · Snippets · Audit"
        states:
          - { id: default }
          - { id: selected }
        locators:
          web: "[data-ui-id='UI-SHELL-NAV']"

      - id: UI-SHELL-ACCOUNT
        type: action
        label: Konto
        status: required
        verify: required
        data_source: "angemeldetes Konto; im Connector-Betrieb zusätzlich die hinterlegten Server"
        semantic_anchor:
          means: Das eigene Konto am Fuß der Leiste. Öffnet ein Menü mit Einstellungen, Unterstützung und Abmelden.
          concept: user_account
          aliases: [profile, me]
          not: [server_entry, identity]
          cardinality: one
        states:
          - { id: default }
          - { id: selected, copy: "Menü offen" }
        locators:
          web: "[data-ui-id='UI-SHELL-ACCOUNT']"

      - id: UI-SHELL-REVEAL
        type: action
        label: Seitenleiste einblenden
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: Der schmale Streifen am linken Rand, solange die Leiste eingeklappt ist. Mit Maus fährt sie beim Überfahren vorübergehend ein, ein Tipp oder Klick holt sie dauerhaft zurück.
          example: "1rem breit; auf Geräten mit grobem Zeiger 1,5rem und voll deckend"
        states:
          - { id: default }
          - { id: disabled, copy: "ausgeblendet, solange die Leiste offen ist" }
        locators:
          web: "[data-ui-id='UI-SHELL-REVEAL']"

      - id: UI-SHELL-MOBILE-NAV
        type: nav
        label: Bereiche (schmaler Schirm)
        status: required
        verify: required
        data_source: "dieselbe Liste wie UI-SHELL-NAV"
        semantic_anchor:
          means: Unter 768px ersetzt eine Leiste am unteren Rand die seitliche. Sie zeigt dieselben Bereiche mit Beschriftung; ein Tipp auf den bereits offenen Bereich klappt dort die Serverliste auf.
          concept: app_section
          aliases: [area, page, route]
          not: [server_entry, session]
          cardinality: many
        states:
          - { id: default }
          - { id: selected }
        locators:
          web: "[data-ui-id='UI-SHELL-MOBILE-NAV']"

  - id: UI-SERVERS
    kind: page
    title: Servers — Arbeitsfläche
    artboard: docs/design/mockups/ui-servers.html
    guide: docs/design/guides/ui-servers.md
    route_hint: /servers
    presentation: { keyboard: "Ctrl+Shift+F Fokus-Modus, E Bearbeiten, T tmux, Ctrl+K Direkt verbinden" }
    uses: [UI-SHELL-NAV, UI-SHELL-ACCOUNT, UI-SHELL-MOBILE-NAV]
    description: Server-Liste, Session-Tabs, Terminal-/Datei-Fläche, Fokus-Modus, Leerzustand.
    elements:
      - id: UI-SERVERS-LIST
        type: list
        label: Server
        status: required
        verify: required
        data_source: "GET /entries — Ordner, Organisationen, Server, OneDrive-Konten des Nutzers"
        semantic_anchor:
          means: Die Verbindungsziele des Nutzers, gruppiert nach Ordner und Organisation, plus verknüpfte OneDrive-Konten.
          concept: server_entry
          aliases: [server, entry, host, folder, organization]
          not: [session, tab, identity, snippet]
          cardinality: many
          example: "Homelab › nas · pihole · Proxmox"
          empty_means: Noch kein Server angelegt — Hinweis auf Anlegen, Import oder Direktverbindung.
        states:
          - { id: default }
          - { id: loading }
          - { id: empty, copy: "Noch keine Server. Server anlegen, SSH-Config importieren oder direkt verbinden." }
          - { id: error, copy: "Serverliste konnte nicht geladen werden." }
          - { id: selected }
        locators:
          web: "[data-ui-id='UI-SERVERS-LIST']"

      - id: UI-SERVERS-SEARCH
        type: field
        label: Suche
        status: required
        verify: recommended
        data_source: static
        semantic_anchor:
          means: Filtert die Server-Liste nach Name, IP oder Tag, ohne die Gruppierung aufzulösen.
        states:
          - { id: default }
          - { id: empty, copy: "Kein Server passt zur Suche." }
        locators:
          web: "[data-ui-id='UI-SERVERS-SEARCH']"

      - id: UI-SERVERS-LIST-MENU
        type: overlay
        label: Kontextmenü Server
        status: required
        verify: recommended
        data_source: static
        semantic_anchor:
          means: Zweitweg für Aktionen auf einem Eintrag — Verbinden, SFTP öffnen, Notizen, Bearbeiten, Duplizieren, Session beitreten, Löschen. Port weiterleiten erscheint nur in der Desktop-App (Tauri), im Web-Build nie.
          not: [primary_navigation]
        states:
          - { id: default }
          - { id: disabled }
        locators:
          web: "[data-ui-id='UI-SERVERS-LIST-MENU']"

      - id: UI-SERVERS-TABS
        type: nav
        label: Sessions
        status: required
        verify: required
        data_source: "offene Sessions des Nutzers (Server-, SFTP-, Notiz-, Skript-Tabs)"
        semantic_anchor:
          means: Die aktuell offenen Sessions als Tabs, jede mit ihrer Split-View-Zuordnungsfarbe; Kontextmenü mit Umbenennen, Duplizieren, Teilen, Schlafen legen, Ausklinken, Schließen.
          concept: session
          aliases: [tab, connection, view]
          not: [server_entry, folder]
          cardinality: many
          example: "nas · pihole (SFTP) · Notizen"
        states:
          - { id: default }
          - { id: selected }
          - { id: empty }
        locators:
          web: "[data-ui-id='UI-SERVERS-TABS']"

      - id: UI-SERVERS-TAB-MARKER
        type: status
        label: Zustand eines Tabs
        status: required
        verify: required
        data_source: "Split-View-Farbe der Session; Fortschritt aus der Terminalausgabe (progressParser)"
        semantic_anchor:
          means: Der Platz links im Tab. Im Ruhezustand ein Punkt in der Farbe des Split-Fensters, zu dem der Tab gehört. Läuft ein Befehl, der Prozente ausgibt, steht dort stattdessen ein Ring, der sich im Uhrzeigersinn füllt.
          concept: session_activity
          aliases: [progress, pane_color]
          not: [connection_state, session]
          cardinality: one
          unit: percent
          example: "grüner Ring bei 42%"
          empty_means: Kein Befehl meldet Fortschritt — der Punkt steht, das ist kein Fehler.
        states:
          - { id: default, copy: "Punkt in der Farbe des Split-Fensters" }
          - { id: loading, copy: "Ring, gefüllt nach dem gemeldeten Prozentsatz" }
        locators:
          web: "[data-ui-id='UI-SERVERS-TAB-MARKER']"

      - id: UI-SERVERS-TAB-LABEL
        type: text
        label: Beschriftung eines Tabs
        status: required
        verify: required
        data_source: "buildTabLabel: Servername, tmux-Sitzung oder Skriptname, eigener Name, Art, Nummer"
        semantic_anchor:
          means: Der Text eines Tabs. Name zuerst, dann die Art in Klammern, zuletzt die Nummer. Die Nummer unterscheidet Tabs, die sonst gleich hießen, und erscheint nur, solange in der Leiste tatsächlich ein zweiter solcher Tab steht.
          concept: session_label
          aliases: [tab_title, name]
          not: [server_entry, hostname]
          cardinality: one
          example: "nas (SFTP) (2)"
          empty_means: Ein Tab ohne Zusatz ist der einzige seiner Art — keine fehlende Angabe.
        states:
          - { id: default, copy: "nas" }
          - { id: selected, copy: "nas (SFTP) (2)" }
        locators:
          web: "[data-ui-id='UI-SERVERS-TAB-LABEL']"

      - id: UI-SERVERS-VIEW
        type: region
        label: Arbeitsfläche
        status: required
        verify: required
        data_source: "aktive Session(en): Terminal (xterm), Datei-Pane, Guacamole, Notizen, Skript"
        semantic_anchor:
          means: Der Inhalt der aktiven Session, einzeln oder als Split; Terminal und Datei-Pane nebeneinander sind der Kernfall.
          concept: session_view
          aliases: [renderer, pane, terminal, file_pane]
          not: [server_entry]
          cardinality: one
        states:
          - { id: default }
          - { id: loading, copy: "Verbinde …" }
          - { id: error, copy: "Verbindung fehlgeschlagen. Erneut versuchen oder Server bearbeiten." }
        locators:
          web: "[data-ui-id='UI-SERVERS-VIEW']"

      - id: UI-SERVERS-FOCUS
        type: toggle
        label: Fokus-Modus
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: Blendet Server-Liste und Tab-Leiste aus, nur das aktive Pane bleibt; Taste Ctrl+Shift+F, greift automatisch unter den Mindestbreiten (Terminal 40 rem, Datei-Pane 22 rem).
          not: [fullscreen_browser]
        states:
          - { id: default }
          - { id: selected }
        locators:
          web: "[data-ui-id='UI-SERVERS-FOCUS']"

      - id: UI-SERVERS-KEYBAR
        type: nav
        label: Tastenleiste
        status: required
        verify: recommended
        data_source: static
        semantic_anchor:
          means: >
            Terminal-Sondertasten (Esc, Tab, Ctrl, Alt, Shift, Pfeile, Home, Ende, Bild auf/ab
            sowie die auf Touch-Tastaturen vergrabenen Zeichen | ~ - /), und nur wenn das aktive
            Pane ein Terminal ist. Sichtbar nach der Einstellung terminal.keyBar
            (auto/always/never); auto heißt "es gibt gar keinen präzisen Zeiger" — die Frage ist
            any-pointer, nicht pointer, denn ein Tablet meldet einen groben Primärzeiger auch mit
            angeschlossener Maus, und wer eine Maus hat, braucht keine Tastenleiste. Sie sitzt
            über der Arbeitsfläche, nicht darunter: unterhalb schneidet eine Kette aus vier
            height-100%-Containern sie ab.
        states:
          - { id: default }
          - { id: disabled }
        locators:
          web: "[data-ui-id='UI-SERVERS-KEYBAR']"

      - id: UI-SERVERS-ACTIONS
        type: action
        label: Aktionen
        status: required
        verify: recommended
        data_source: static
        semantic_anchor:
          means: >
            Werkzeuge für das aktive Pane: Snippets, Broadcast an alle Panes
            (nur bei geteilter Ansicht bedienbar), Vollbild. Tastenkürzel nur
            bei Guacamole-Sitzungen, wo sie hingehören. Teilen, Ausklinken und Schließen
            liegen im Tab-Kontextmenü (UI-SERVERS-TABS), nicht hier — die
            Trennung ist beabsichtigt: hier Werkzeuge, dort Sitzungsverwaltung.
        states:
          - { id: default }
          - { id: disabled }
        locators:
          web: "[data-ui-id='UI-SERVERS-ACTIONS']"

      - id: UI-SERVERS-WELCOME
        type: empty
        label: Willkommen
        status: required
        verify: required
        data_source: "GET /entries/recent?limit=5"
        semantic_anchor:
          means: >
            Leerzustand ohne offene Session — links die Begrüßung mit Namen und die Einstiege
            (Schnellverbindung, Server anlegen, Gerät verbinden, Apps herunterladen), rechts die
            zuletzt genutzten Verbindungen als Zeilen mit Farbfeld (Kennfarbe aus der Eintrags-ID,
            nicht die Pane-Farbe eines Tabs), Name, Alter und Protokoll-Badge. Schlafende
            Sitzungen erscheinen in der Liste und werden fortgesetzt statt neu verbunden.
            Positiv, handlungsorientiert, kein Marketing.
          concept: recent_connection
          aliases: [recent, history]
          not: [all_servers, marketing]
          cardinality: many
          example: "nas · pihole · proxmox · build-01 · vpn"
          empty_means: Noch nie verbunden — Erste Schritte zeigen.
        states:
          - { id: default }
          - { id: loading, copy: "Platzhalter-Zeilen, kein Spinner — die Spalte behält ihre Höhe." }
          - { id: empty, copy: "Noch nichts verbunden. Sobald du dich zum ersten Mal verbindest, stehen die Ziele hier." }
        locators:
          web: "[data-ui-id='UI-SERVERS-WELCOME']"

  - id: UI-SERVER-DIALOG
    kind: dialog
    title: Server anlegen / bearbeiten
    artboard: docs/design/mockups/ui-server-dialog.html
    guide: docs/design/guides/ui-server-dialog.md
    presentation: { over: UI-SERVERS, trigger: "Kontextmenü › Bearbeiten / Neu, Taste E", size: "mittig, 44rem, max 85vh", dismiss: "Esc, Backdrop, Abbrechen; nach Speichern automatisch", keyboard: "Ctrl+1/2/3 Tabs, Ctrl+Enter Speichern" }
    description: Drei Tabs — Details, Identität, Einstellungen.
    elements:
      - id: UI-SERVER-DIALOG-TABS
        type: nav
        label: Details · Identität · Einstellungen
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: Die drei Abschnitte des Dialogs in fester Reihenfolge.
        states:
          - { id: default }
          - { id: selected }
        locators:
          web: "[data-ui-id='UI-SERVER-DIALOG-TABS']"

      - id: UI-SERVER-DIALOG-DETAILS
        type: form
        label: Details
        status: required
        verify: required
        data_source: "Server-Stammdaten"
        semantic_anchor:
          means: Name, Icon, Server-IP, Port, Protokoll, Engine, MAC-Adresse und WoL-Broadcast des Servers.
          concept: server_entry
          aliases: [server, host]
          not: [identity]
          cardinality: one
          example: "nas · 192.168.2.151 · 22 · SSH"
        states:
          - { id: default }
          - { id: error, copy: "Engine offline — Verbindung erst nach Start möglich." }
        locators:
          web: "[data-ui-id='UI-SERVER-DIALOG-DETAILS']"

      - id: UI-SERVER-DIALOG-IDENTITY
        type: form
        label: Identität
        status: required
        verify: required
        data_source: "Identitäten des Nutzers und der Organisation"
        semantic_anchor:
          means: Zugangsdaten, mit denen dieser Server erreicht wird — persönliche und Organisations-Identitäten, verknüpfbar; Authentifizierung Passwort, SSH-Key oder beides.
          concept: identity
          aliases: [credential, ssh_key, login]
          not: [server_entry, user_account]
          cardinality: many
          example: "ma.backes (SSH-Key) · deploy (Passwort)"
          empty_means: Keine Identität vorhanden — Anlegen anbieten.
        states:
          - { id: default }
          - { id: empty, copy: "Keine persönlichen Identitäten. Neue Identität anlegen." }
        locators:
          web: "[data-ui-id='UI-SERVER-DIALOG-IDENTITY']"

      - id: UI-SERVER-DIALOG-SETTINGS
        type: form
        label: Einstellungen
        status: required
        verify: recommended
        data_source: "Server-Einstellungen"
        semantic_anchor:
          means: >
            Verhalten dieses Servers, nicht seine Stammdaten: Jump-Hosts,
            Startbefehl, tmux ein/aus, Monitoring, Wake-on-LAN,
            Terminal-Tastenverhalten (Backspace, Entf, Funktionstasten) und
            für RDP zusätzlich Sicherheit, Tastaturlayout, Anzeige, Audio
            und Leistung.
          not: [server_entry]
        states:
          - { id: default }
        locators:
          web: "[data-ui-id='UI-SERVER-DIALOG-SETTINGS']"

      - id: UI-SERVER-DIALOG-SAVE
        type: action
        label: Speichern
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: Legt den Server an bzw. speichert Änderungen und schließt den Dialog; Beschriftung „Erstellen" beim Anlegen, „Speichern" beim Bearbeiten.
        states:
          - { id: default }
          - { id: disabled }
          - { id: error }
        locators:
          web: "[data-ui-id='UI-SERVER-DIALOG-SAVE']"

  - id: UI-TMUX-DIALOG
    kind: dialog
    title: tmux-Sessions
    artboard: docs/design/mockups/ui-tmux-dialog.html
    guide: docs/design/guides/ui-tmux-dialog.md
    presentation: { over: UI-SERVERS, trigger: "Kontextmenü › Session beitreten, Taste T", size: "mittig, 52rem, max 80vh", dismiss: "Esc, Backdrop, Abbrechen; nach Beitreten automatisch", keyboard: "↑↓ Session, ←→ Fenster, Enter Beitreten, N Neu" }
    description: Sessions auf dem verbundenen Server, Fenster-Raster der gewählten Session, Beitreten oder Neu.
    elements:
      - id: UI-TMUX-DIALOG-SESSIONS
        type: list
        label: Sessions
        status: required
        verify: required
        data_source: "tmux list-sessions auf dem verbundenen Server"
        semantic_anchor:
          means: >
            Die tmux-Sessions des Servers — nicht Outposts eigene Tabs. Eine Zeile je Session:
            der Name in voller Länge, rechts die drei Aktionen (Fenster anzeigen, Umbenennen,
            Beenden), die über dem Zeilenende liegen und nur auf der Zeile erscheinen, auf der
            man ist. Die Fensterzahl steht nicht als Text da — sie ist im Fenster-Icon
            gezeichnet; der Name braucht den Platz.
          concept: tmux_session
          aliases: [session, tmux]
          not: [tab, server_entry, window]
          cardinality: many
          example: "outpost-browser · nexterm-refork · preflight (aktiv)"
          empty_means: Kein tmux-Socket oder keine Session — leerer Picker, kein Fehler.
        states:
          - { id: default }
          - { id: loading }
          - { id: empty, copy: "Keine tmux-Session. Neue Session starten." }
          - { id: error, copy: "tmux nicht erreichbar." }
          - { id: selected }
        locators:
          web: "[data-ui-id='UI-TMUX-DIALOG-SESSIONS']"

      - id: UI-TMUX-DIALOG-WINDOWS
        type: list
        label: Fenster
        status: required
        verify: required
        data_source: "tmux list-windows der gewählten Session"
        semantic_anchor:
          means: Die Fenster der gewählten Session als Raster, aktives Fenster markiert.
          concept: tmux_window
          aliases: [window, pane_group]
          not: [tmux_session, tab]
          cardinality: many
          example: "0 bash · 1 htop · 2 logs"
        states:
          - { id: default }
          - { id: empty }
          - { id: selected }
        locators:
          web: "[data-ui-id='UI-TMUX-DIALOG-WINDOWS']"

      - id: UI-TMUX-DIALOG-ATTACH
        type: action
        label: Beitreten
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: Hängt das Terminal an die gewählte Session und das gewählte Fenster.
        states:
          - { id: default }
          - { id: disabled }
        locators:
          web: "[data-ui-id='UI-TMUX-DIALOG-ATTACH']"

      - id: UI-TMUX-DIALOG-NEW
        type: action
        label: Neue Session
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: Startet eine neue tmux-Session auf dem Server und hängt sich an.
        states:
          - { id: default }
        locators:
          web: "[data-ui-id='UI-TMUX-DIALOG-NEW']"

  - id: UI-DIRECT-CONNECT
    kind: dialog
    title: Direkt verbinden
    artboard: docs/design/mockups/ui-direct-connect.html
    guide: docs/design/guides/ui-direct-connect.md
    presentation: { over: UI-SERVERS, trigger: "Welcome › Schnellverbindung, Taste Ctrl+K", size: "mittig, 26rem", dismiss: "Esc, Backdrop; nach Verbinden automatisch", keyboard: "Enter Verbinden" }
    description: Einmalverbindung ohne gespeicherten Server.
    elements:
      - id: UI-DIRECT-CONNECT-HOST
        type: field
        label: Host
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: Zieladresse (Host oder IP) und Port für eine Einmalverbindung.
        states:
          - { id: default }
          - { id: error, copy: "Host nicht erreichbar." }
        locators:
          web: "[data-ui-id='UI-DIRECT-CONNECT-HOST']"

      - id: UI-DIRECT-CONNECT-AUTH
        type: form
        label: Authentifizierung
        status: required
        verify: required
        data_source: "Auswahl Passwort / SSH-Key / beides, dann Benutzername, Passwort, Key, Passphrase"
        semantic_anchor:
          means: Zugangsdaten nur für diese Verbindung — nicht gespeichert, keine Identität.
          concept: credential
          aliases: [auth, login]
          not: [identity, server_entry]
          cardinality: one
        states:
          - { id: default }
          - { id: error, copy: "Anmeldung abgelehnt." }
        locators:
          web: "[data-ui-id='UI-DIRECT-CONNECT-AUTH']"

      - id: UI-DIRECT-CONNECT-GO
        type: action
        label: Verbinden
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: Öffnet eine Session-Tab mit dieser Verbindung und schließt den Dialog.
        states:
          - { id: default }
          - { id: disabled }
          - { id: loading, copy: "Verbinde …" }
        locators:
          web: "[data-ui-id='UI-DIRECT-CONNECT-GO']"
