          web: "[data-ui-id='UI-API-KEYS-AGENTS']"

  - id: UI-VAULT-APPROVAL
    kind: shared
    title: Freigabe-Karte
    artboard: docs/design/mockups/ui-vault-approval.html
    guide: docs/design/guides/ui-vault-approval.md
    presentation: { over: "UI-SHELL, auch im Popout", trigger: "ein Agent fordert die Nutzung eines Vault-Eintrags an", size: "unten rechts, 24rem; unter 768px volle Breite über der unteren Navigation", dismiss: "nur durch Antwort oder Ablauf", keyboard: "Tab erreicht die Karte; Enter Einmal, Esc Ablehnen, solange die Karte den Fokus hat" }
    description: Schwebt über jeder Seite, ohne modal zu sein, solange eine Freigabe-Anfrage offen ist.
    elements:
      - id: UI-VAULT-APPROVAL-CARD
        type: overlay
        label: Freigabe angefordert
        status: required
        verify: required
        data_source: "offene Freigabe-Anfragen des Kontos, verteilt über den StateBroadcaster"
        semantic_anchor:
          means: >
            Eine Karte unten rechts über jeder Seite, nicht modal: ein Agent will einen
            Vault-Eintrag nutzen. Zeigt Agent und Server, Eintrag und Ziel (Ursprung oder
            Host) und die verbleibende Zeit; Antworten Einmal, Für diese Sitzung, Ablehnen.
            Mehrere Anfragen stapeln sich, die älteste unten. Der Stapel liegt über Dialogen und
            Toasts. Eine abgelaufene Karte zeigt fünf Sekunden den Fehlerzustand und verschwindet;
            scheitert das Senden einer Antwort, bleibt die Karte stehen und ein Toast nennt den Grund.
          concept: approval_request
          aliases: [approval, consent]
          not: [notification, toast, error]
          cardinality: many
          example: "Claude Code auf web01 · portal-login → https://portal.example.com · 1:42"
          empty_means: Keine Anfrage offen — die Karte ist nicht da.
        states:
          - { id: default }
          - { id: empty }
          - { id: partial, copy: "3 Anfragen offen" }
          - { id: loading, copy: "Antwort wird gesendet …" }
          - { id: error, copy: "Anfrage ist abgelaufen." }
        locators:
          web: "[data-ui-id='UI-VAULT-APPROVAL-CARD']"
