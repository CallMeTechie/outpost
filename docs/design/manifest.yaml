schema: mockingbird/1
project: outpost
revision: 14
updated: 2026-10-09
design_system: docs/design/design-system.md
mockups_index: docs/design/mockups/index.html
tokens_css: docs/design/mockups/tokens.css
token_definitions: [client/src/common/styles/_colors.sass, client/src/common/styles/_tokens.sass]
source_roots: [client/src]

changelog:
  - rev: 1
    date: 2026-09-03
    summary: Runde 1 — Servers-Arbeitsfläche und drei Dialoge, Bestand festgeschrieben, Fokus-Modus neu
    touched: [UI-SERVERS, UI-SERVER-DIALOG, UI-TMUX-DIALOG, UI-DIRECT-CONNECT]
  - rev: 2
    date: 2026-09-07
    summary: Runde 2 — Shell-Navigation erstmals gestaltet; Tab-Markierung und Tab-Beschriftung nachgetragen, die im Code entstanden waren
    touched: [UI-SHELL, UI-SERVERS-TAB-MARKER, UI-SERVERS-TAB-LABEL]
  - rev: 3
    date: 2026-09-08
    summary: Runde 3 — der Streifen am Tab trägt die Kontextfüllung einer Agenten-Sitzung
    touched: [UI-SERVERS-TAB-CONTEXT]
  - rev: 4
    date: 2026-09-08
    summary: Runde 4 — das Datei-Pane erstmals gezeichnet; Favoritenleiste mit Stern, Überlauf und Kontextmenüs neu, das Eröffnungsverzeichnis wird gemerkt
    touched: [UI-FILES, UI-FILES-ACTIONBAR, UI-FILES-ADDRESS, UI-FILES-FAVORITES-TOGGLE, UI-FILES-FAVORITES, UI-FILES-FAVORITES-OVERFLOW, UI-FILES-FAVORITE-MENU, UI-FILES-LIST, UI-FILES-LIST-MENU, UI-FILES-EMPTY-MENU]
  - rev: 5
    date: 2026-09-08
    summary: Das Eröffnungsverzeichnis zählt je Identität, nicht nur je Server — und es heißt Startverzeichnis, weil das Pane auch FTP bedient; die Bookmark-Herkunft nennt den Schlüssel, an dem „schon gemerkt" hängt
    touched: [UI-FILES-ADDRESS, UI-FILES-FAVORITES]
  - rev: 6
    date: 2026-10-05
    summary: Runde 6 — Reconnect; die Fehlerkarte einer Session verbindet neu, der Tab zeigt den Verbindungszustand am Label statt im Marker
    touched: [UI-SERVERS-VIEW-ERROR, UI-SERVERS-TAB-CONNECTION, UI-SERVERS-TABS, UI-SERVERS-VIEW]
  - rev: 7
    date: 2026-10-05
    summary: Fehlerkarte final — bei RDP-Abmelden oder -Trennung kein Neu verbinden, weil der Server diese Sitzung nicht zum Wiederaufbau aufhebt
    touched: [UI-SERVERS-VIEW-ERROR]
  - rev: 8
    date: 2026-10-08
    summary: Browser-Tab — Session ohne Server, eigene Arbeitsfläche mit Adressleiste, Agenten-Anzeiger und Pause
    touched: [UI-SERVERS-TABS, UI-SERVERS-TAB-LABEL, UI-SERVERS-VIEW]
  - rev: 11
    date: 2026-10-09
    summary: Runde 11 — Vault; eigene Seite mit Liste und Details, Eintrag-Dialog, Agenten-Zugang je Server, Freigabe-Karte über jeder Seite, Einstellungen und Agenten-Keys; Navigation und Server-Kontextmenü ergänzt
    touched: [UI-VAULT, UI-VAULT-DIALOG, UI-AGENT-ACCESS, UI-VAULT-SETTINGS, UI-API-KEYS, UI-VAULT-APPROVAL, UI-SHELL-NAV, UI-SHELL-MOBILE-NAV, UI-SERVERS-LIST-MENU]
  - rev: 12
    date: 2026-10-09
    summary: Nachzug aus preflight — Proxy-Warnung, gemessene Adresse, Warnung bei fremdem Konto, entfernter Benutzer im Ergebnis, verworfene Werte nach Zieländerung
    touched: [UI-VAULT-SETTINGS-PROXY, UI-AGENT-ACCESS-IPBIND, UI-AGENT-ACCESS-SETUP, UI-AGENT-ACCESS-RESULT, UI-VAULT-DIALOG-SECRET, UI-VAULT-DETAIL-SECRET]
  - rev: 13
    date: 2026-10-10
    summary: Nachzug aus dem Umsetzungsplan — Hinweise im Agenten-Zugang für ersetzte Registrierung, gescheiterte Messung und Abweisung ohne Übernahme
    touched: [UI-AGENT-ACCESS-RESULT, UI-AGENT-ACCESS-IPBIND]
  - rev: 14
    date: 2026-10-10
    summary: Nachzug aus dem Plan-Review — Ergebnis des Entziehens, wenn die Registrierung einem anderen Konto gehört oder nicht entfernt werden konnte
    touched: [UI-AGENT-ACCESS-KEYS, UI-API-KEYS-AGENTS]

adapters:
  web: { locator: attribute, attribute: data-ui-id, visual_check: false }
primary_adapter: web

screens:
  - id: UI-SHELL
    kind: shared
    title: Rahmen — Navigation
    artboard: docs/design/mockups/ui-shell.html
    guide: docs/design/guides/ui-shell.md
    presentation: { keyboard: "Tab-Reihenfolge Logo → Navigation → Konto; Enter und Leertaste holen die eingeklappte Leiste zurück" }
    description: Die Navigation, die jede Seite umgibt — als Leiste links, unter 768px als Leiste unten.
    elements:
      - id: UI-SHELL-LOGO
        type: media
        label: Outpost
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: Die Bildmarke, zugleich der Schalter, der die Leiste ein- und ausklappt. Vier Pfosten unterschiedlicher Höhe, der letzte in der Erfolgsfarbe.
          example: "42px im Kopf der Leiste"
        states:
          - { id: default }
          - { id: selected, copy: "eingeklappt — die Leiste ist verborgen" }
        locators:
          web: "[data-ui-id='UI-SHELL-LOGO']"

      - id: UI-SHELL-NAV
        type: nav
        label: Bereiche
        status: required
        verify: required
        data_source: "useSidebarNavigation(): getSidebarNavigation(t), gefiltert nach den Rechten des Kontos und, für Browser, nach GET /api/browser/available"
        semantic_anchor:
          means: Die Bereiche der Anwendung — Server, Monitoring, Snippets, Vault, Audit — und dazwischen die Aktion Browser. Ein Eintrag je Bereich, der aktive hervorgehoben; Browser ist kein Bereich, sondern öffnet unter Server einen neuen Browser-Tab und wird deshalb nie hervorgehoben. Browser nur, wenn Browser-Tabs aktiviert sind und das Konto das Recht dazu hat; Vault nur, wenn der Vault eingeschaltet ist und das Konto vault.use hat oder Mitglied einer Organisation ist; Audit nur mit dem Recht dafür.
          concept: app_section
          aliases: [area, page, route]
          not: [server_entry, session]
          cardinality: many
          example: "Server · Monitoring · Snippets · Vault · Browser · Audit"
        states:
          - { id: default }
          - { id: selected }
        locators:
          web: "[data-ui-id='UI-SHELL-NAV']"

      - id: UI-SHELL-ACCOUNT
        type: action
        label: Konto
        status: required
        verify: required
        data_source: "angemeldetes Konto; im Connector-Betrieb zusätzlich die hinterlegten Server"
        semantic_anchor:
          means: Das eigene Konto am Fuß der Leiste. Öffnet ein Menü mit Einstellungen, Unterstützung und Abmelden.
          concept: user_account
          aliases: [profile, me]
          not: [server_entry, identity]
          cardinality: one
        states:
          - { id: default }
          - { id: selected, copy: "Menü offen" }
        locators:
          web: "[data-ui-id='UI-SHELL-ACCOUNT']"

      - id: UI-SHELL-REVEAL
        type: action
        label: Seitenleiste einblenden
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: Der schmale Streifen am linken Rand, solange die Leiste eingeklappt ist. Mit Maus fährt sie beim Überfahren vorübergehend ein, ein Tipp oder Klick holt sie dauerhaft zurück.
          example: "1rem breit; auf Geräten mit grobem Zeiger 1,5rem und voll deckend"
        states:
          - { id: default }
          - { id: disabled, copy: "ausgeblendet, solange die Leiste offen ist" }
        locators:
          web: "[data-ui-id='UI-SHELL-REVEAL']"

      - id: UI-SHELL-MOBILE-NAV
        type: nav
        label: Bereiche (schmaler Schirm)
        status: required
        verify: required
        data_source: "dieselbe Liste wie UI-SHELL-NAV"
        semantic_anchor:
          means: Unter 768px ersetzt eine Leiste am unteren Rand die seitliche. Sie zeigt dieselben Einträge mit Beschriftung, Browser auch hier als Aktion ohne hervorgehobenen Zustand; ein Tipp auf den bereits offenen Bereich klappt dort die Serverliste auf.
          concept: app_section
          aliases: [area, page, route]
          not: [server_entry, session]
          cardinality: many
        states:
          - { id: default }
          - { id: selected }
        locators:
          web: "[data-ui-id='UI-SHELL-MOBILE-NAV']"

  - id: UI-SERVERS
    kind: page
    title: Servers — Arbeitsfläche
    artboard: docs/design/mockups/ui-servers.html
    guide: docs/design/guides/ui-servers.md
    route_hint: /servers
    presentation: { keyboard: "Ctrl+Shift+F Fokus-Modus, E Bearbeiten, T tmux, Ctrl+K Direkt verbinden" }
    uses: [UI-SHELL-NAV, UI-SHELL-ACCOUNT, UI-SHELL-MOBILE-NAV]
    description: Server-Liste, Session-Tabs, Terminal-/Datei-Fläche, Fokus-Modus, Leerzustand.
    elements:
      - id: UI-SERVERS-LIST
        type: list
        label: Server
        status: required
        verify: required
        data_source: "GET /entries — Ordner, Organisationen, Server, OneDrive-Konten des Nutzers"
        semantic_anchor:
          means: Die Verbindungsziele des Nutzers, gruppiert nach Ordner und Organisation, plus verknüpfte OneDrive-Konten.
          concept: server_entry
          aliases: [server, entry, host, folder, organization]
          not: [session, tab, identity, snippet]
          cardinality: many
          example: "Homelab › nas · pihole · Proxmox"
          empty_means: Noch kein Server angelegt — Hinweis auf Anlegen, Import oder Direktverbindung.
        states:
          - { id: default }
          - { id: loading }
          - { id: empty, copy: "Noch keine Server. Server anlegen, SSH-Config importieren oder direkt verbinden." }
          - { id: error, copy: "Serverliste konnte nicht geladen werden." }
          - { id: selected }
        locators:
          web: "[data-ui-id='UI-SERVERS-LIST']"

      - id: UI-SERVERS-SEARCH
        type: field
        label: Suche
        status: required
        verify: recommended
        data_source: static
        semantic_anchor:
          means: Filtert die Server-Liste nach Name, IP oder Tag, ohne die Gruppierung aufzulösen.
        states:
          - { id: default }
          - { id: empty, copy: "Kein Server passt zur Suche." }
        locators:
          web: "[data-ui-id='UI-SERVERS-SEARCH']"

      - id: UI-SERVERS-LIST-MENU
        type: overlay
        label: Kontextmenü Server
        status: required
        verify: recommended
        data_source: static
        semantic_anchor:
          means: Zweitweg für Aktionen auf einem Eintrag — Verbinden, SFTP öffnen, Notizen, Bearbeiten, Duplizieren, Session beitreten, Agenten-Zugang… (nur SSH, nur bei eingeschaltetem Vault), Löschen. Port weiterleiten erscheint nur in der Desktop-App (Tauri), im Web-Build nie.
          not: [primary_navigation]
        states:
          - { id: default }
          - { id: disabled }
        locators:
          web: "[data-ui-id='UI-SERVERS-LIST-MENU']"

      - id: UI-SERVERS-TABS
        type: nav
        label: Sessions
        status: required
        verify: required
        data_source: "offene Sessions des Nutzers (Server-, SFTP-, Notiz-, Skript-, Browser-Tabs)"
        semantic_anchor:
          means: Die aktuell offenen Sessions als Tabs, jede mit ihrer Split-View-Zuordnungsfarbe; Kontextmenü mit Umbenennen, Duplizieren, Teilen, Schlafen legen, Ausklinken, Schließen — bei einer getrennten Session zusätzlich Neu verbinden, an erster Stelle.
          concept: session
          aliases: [tab, connection, view]
          not: [server_entry, folder]
          cardinality: many
          example: "nas · pihole (SFTP) · Notizen"
        states:
          - { id: default }
          - { id: selected }
          - { id: empty }
        locators:
          web: "[data-ui-id='UI-SERVERS-TABS']"

      - id: UI-SERVERS-TAB-MARKER
        type: status
        label: Zustand eines Tabs
        status: required
        verify: required
        data_source: "Split-View-Farbe der Session; Fortschritt aus der Terminalausgabe (progressParser)"
        semantic_anchor:
          means: Der Platz links im Tab. Im Ruhezustand ein Punkt in der Farbe des Split-Fensters, zu dem der Tab gehört. Läuft ein Befehl, der Prozente ausgibt, steht dort stattdessen ein Ring, der sich im Uhrzeigersinn füllt.
          concept: session_activity
          aliases: [progress, pane_color]
          not: [connection_state, session]
          cardinality: one
          unit: percent
          example: "grüner Ring bei 42%"
          empty_means: Kein Befehl meldet Fortschritt — der Punkt steht, das ist kein Fehler.
        states:
          - { id: default, copy: "Punkt in der Farbe des Split-Fensters" }
          - { id: loading, copy: "Ring, gefüllt nach dem gemeldeten Prozentsatz" }
        locators:
          web: "[data-ui-id='UI-SERVERS-TAB-MARKER']"

      - id: UI-SERVERS-TAB-CONTEXT
        type: status
        label: Kontextfüllung
        status: required
        verify: required
        data_source: "Marke im Terminalstrom, vom Agenten selbst geschrieben: ⟦ctx <werkzeug> <prozent>⟧"
        semantic_anchor:
          means: Der Streifen am oberen Rand eines Tabs. Ohne Agenten die Farbe des Split-Fensters über die volle Breite; meldet ein Agent seine Kontextfüllung, wird derselbe Streifen zur Spur, in der ein Balken dieser Länge wächst -- in derselben Farbe, aber höher, damit „kein Agent" und „randvoll" sich unterscheiden.
          concept: agent_context
          aliases: [context_window, token_usage]
          not: [session_activity, connection_state, pane_color]
          cardinality: one
          unit: percent
          example: "42 % bei einer Claude-Code-Sitzung"
          source_of_truth: der Agent selbst; für Claude Code die eigene Statuszeile, für qwen die tmux-Statusleiste
          empty_means: In diesem Tab läuft kein Agent, der etwas meldet — nicht, dass der Kontext leer wäre.
        states:
          - { id: default, copy: "Fensterfarbe über die volle Breite, 2px" }
          - { id: loading, copy: "Balken nach dem gemeldeten Prozentsatz, 3px, über sichtbarer Spur" }
        locators:
          web: "[data-ui-id='UI-SERVERS-TAB-CONTEXT']"

      - id: UI-SERVERS-TAB-LABEL
        type: text
        label: Beschriftung eines Tabs
        status: required
        verify: required
        data_source: "buildTabLabel: Servername, tmux-Sitzung oder Skriptname, Seitentitel eines Browser-Tabs, eigener Name, Art, Nummer"
        semantic_anchor:
          means: Der Text eines Tabs. Name zuerst, dann die Art in Klammern, zuletzt die Nummer. Die Nummer unterscheidet Tabs, die sonst gleich hießen, und erscheint nur, solange in der Leiste tatsächlich ein zweiter solcher Tab steht.
          concept: session_label
          aliases: [tab_title, name]
          not: [server_entry, hostname]
          cardinality: one
          example: "nas (SFTP) (2)"
          empty_means: Ein Tab ohne Zusatz ist der einzige seiner Art — keine fehlende Angabe.
        states:
          - { id: default, copy: "nas" }
          - { id: selected, copy: "nas (SFTP) (2)" }
        locators:
          web: "[data-ui-id='UI-SERVERS-TAB-LABEL']"

      - id: UI-SERVERS-TAB-CONNECTION
        type: status
        label: Verbindungszustand eines Tabs
        status: required
        verify: required
        data_source: "Fehler- und Reconnect-Zustand der Session (erroredSessions, useAutoReconnect)"
        semantic_anchor:
          means: >
            Zeigt am Label, dass die Verbindung einer Session weg ist oder gerade neu aufgebaut wird:
            das Label wird in --subtext gedämpft, dahinter steht ein kleines Icon — Unplug bei getrennt,
            ein sich drehendes RotateCw beim Neuverbinden. Im Normalzustand ist nichts zu sehen.
            Marker und Kontextstreifen bleiben unberührt; ein Ring im Marker heißt weiterhin Fortschritt,
            nicht Verbindung.
          concept: connection_state
          aliases: [reconnect, disconnected]
          not: [session_activity, agent_context, pane_color]
          cardinality: one
          example: "nas ⏚ (gedämpft) während der Countdown läuft"
          empty_means: Die Verbindung steht — kein Zusatz am Label.
        states:
          - { id: default, copy: "kein Zusatz" }
          - { id: loading, copy: "Label gedämpft, RotateCw dreht sich" }
          - { id: error, copy: "Label gedämpft, Unplug" }
        locators:
          web: "[data-ui-id='UI-SERVERS-TAB-CONNECTION']"

      - id: UI-SERVERS-VIEW
        type: region
        label: Arbeitsfläche
        status: required
        verify: required
        data_source: "aktive Session(en): Terminal (xterm), Datei-Pane, Guacamole, Notizen, Skript, Browser"
        semantic_anchor:
          means: Der Inhalt der aktiven Session, einzeln oder als Split; Terminal und Datei-Pane nebeneinander sind der Kernfall.
          concept: session_view
          aliases: [renderer, pane, terminal, file_pane]
          not: [server_entry]
          cardinality: one
        states:
          - { id: default }
          - { id: loading, copy: "Verbinde …" }
          - { id: error, ref: UI-SERVERS-VIEW-ERROR }
        locators:
          web: "[data-ui-id='UI-SERVERS-VIEW']"

      - id: UI-SERVERS-VIEW-ERROR
        type: status
        label: Verbindungsfehler
        status: required
        verify: required
        data_source: "Fehler der Session (classifyConnectionError), Reconnect-Zustand {attempt, maxAttempts, nextAttemptAt}"
        semantic_anchor:
          means: >
            Die Karte, die in der Arbeitsfläche an die Stelle einer abgebrochenen Session tritt:
            Icon, Titel, Fehlertext im Klartext, darunter eine Knopfzeile. Primär Neu verbinden
            (während der Automatik Jetzt verbinden), sekundär Schließen. Läuft die Automatik, steht
            über den Knöpfen der Countdown mit Versuchszähler. Neu verbinden baut dieselbe Session im
            selben Tab und an derselben Stelle im Layout wieder auf; es öffnet keinen neuen Tab.
          concept: connection_error
          aliases: [reconnect, retry, disconnected]
          not: [server_entry, server_dialog]
          cardinality: one
          example: "Verbindung verloren · Neuer Versuch in 8 s · Versuch 2/5"
        states:
          - { id: default, copy: "Verbindung verloren. Neu verbinden oder schließen." }
          - { id: countdown, copy: "Neuer Versuch in 8 s · Versuch 2/5" }
          - { id: loading, copy: "Verbinde neu …" }
          - { id: final, copy: "Anmeldung abgelehnt. Zugangsdaten prüfen, dann neu verbinden. — Nach RDP-Abmelden oder -Trennung nur Schließen." }
          - { id: expired, copy: "Sitzung abgelaufen. Öffne den Server neu." }
        locators:
          web: "[data-ui-id='UI-SERVERS-VIEW-ERROR']"

      - id: UI-SERVERS-FOCUS
        type: toggle
        label: Fokus-Modus
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: Blendet Server-Liste und Tab-Leiste aus, nur das aktive Pane bleibt; Taste Ctrl+Shift+F, greift automatisch unter den Mindestbreiten (Terminal 40 rem, Datei-Pane 22 rem).
          not: [fullscreen_browser]
        states:
          - { id: default }
          - { id: selected }
        locators:
          web: "[data-ui-id='UI-SERVERS-FOCUS']"

      - id: UI-SERVERS-KEYBAR
        type: nav
        label: Tastenleiste
        status: required
        verify: recommended
        data_source: static
        semantic_anchor:
          means: >
            Terminal-Sondertasten (Esc, Tab, Ctrl, Alt, Shift, Pfeile, Home, Ende, Bild auf/ab
            sowie die auf Touch-Tastaturen vergrabenen Zeichen | ~ - /), und nur wenn das aktive
            Pane ein Terminal ist. Sichtbar nach der Einstellung terminal.keyBar
            (auto/always/never); auto heißt "es gibt gar keinen präzisen Zeiger" — die Frage ist
            any-pointer, nicht pointer, denn ein Tablet meldet einen groben Primärzeiger auch mit
            angeschlossener Maus, und wer eine Maus hat, braucht keine Tastenleiste. Sie sitzt
            über der Arbeitsfläche, nicht darunter: unterhalb schneidet eine Kette aus vier
            height-100%-Containern sie ab.
        states:
          - { id: default }
          - { id: disabled }
        locators:
          web: "[data-ui-id='UI-SERVERS-KEYBAR']"

      - id: UI-SERVERS-ACTIONS
        type: action
        label: Aktionen
        status: required
        verify: recommended
        data_source: static
        semantic_anchor:
          means: >
            Werkzeuge für das aktive Pane: Snippets, Broadcast an alle Panes
            (nur bei geteilter Ansicht bedienbar), Vollbild. Tastenkürzel nur
            bei Guacamole-Sitzungen, wo sie hingehören. Teilen, Ausklinken und Schließen
            liegen im Tab-Kontextmenü (UI-SERVERS-TABS), nicht hier — die
            Trennung ist beabsichtigt: hier Werkzeuge, dort Sitzungsverwaltung.
        states:
          - { id: default }
          - { id: disabled }
        locators:
          web: "[data-ui-id='UI-SERVERS-ACTIONS']"

      - id: UI-SERVERS-WELCOME
        type: empty
        label: Willkommen
        status: required
        verify: required
        data_source: "GET /entries/recent?limit=5"
        semantic_anchor:
          means: >
            Leerzustand ohne offene Session — links die Begrüßung mit Namen und die Einstiege
            (Schnellverbindung, Server anlegen, Gerät verbinden, Apps herunterladen), rechts die
            zuletzt genutzten Verbindungen als Zeilen mit Farbfeld (Kennfarbe aus der Eintrags-ID,
            nicht die Pane-Farbe eines Tabs), Name, Alter und Protokoll-Badge. Schlafende
            Sitzungen erscheinen in der Liste und werden fortgesetzt statt neu verbunden.
            Positiv, handlungsorientiert, kein Marketing.
          concept: recent_connection
          aliases: [recent, history]
          not: [all_servers, marketing]
          cardinality: many
          example: "nas · pihole · proxmox · build-01 · vpn"
          empty_means: Noch nie verbunden — Erste Schritte zeigen.
        states:
          - { id: default }
          - { id: loading, copy: "Platzhalter-Zeilen, kein Spinner — die Spalte behält ihre Höhe." }
          - { id: empty, copy: "Noch nichts verbunden. Sobald du dich zum ersten Mal verbindest, stehen die Ziele hier." }
        locators:
          web: "[data-ui-id='UI-SERVERS-WELCOME']"

  - id: UI-FILES
    kind: panel
    title: Datei-Pane — Aktionsleiste und Favoriten
    artboard: docs/design/mockups/ui-files.html
    guide: docs/design/guides/ui-files.md
    presentation: { over: UI-SERVERS, trigger: "Datei-Sitzung (SFTP) eines Servers im Tab; in der geteilten Ansicht je Kachel einmal", size: "füllt die Kachel — Aktionsleiste oben, darunter der Favoritenstreifen (--favorites-bar-height), darunter die Dateiliste", dismiss: "Tab schließen", keyboard: "Strg+B Favoritenleiste, ←/→ zwischen den Chips, Umschalt+←/→ verschiebt einen Chip, Enter öffnet" }
    description: Das Datei-Pane einer SFTP-Sitzung — die Aktionsleiste mit dem Stern, die Favoritenleiste mit Chips und Überlauf, und die beiden Kontextmenüs, über die Bookmarks entstehen.
    elements:
      - id: UI-FILES-ACTIONBAR
        type: region
        label: Aktionsleiste
        status: required
        verify: recommended
        data_source: static
        semantic_anchor:
          means: >
            Bestand: Zurück, Vorwärts, Hoch, die Adresszeile, und rechts die Icon-Gruppe
            Suchen · Ansicht · Neu laden · Datei hochladen · Ordner hochladen · Neue Datei ·
            Neuer Ordner. Diese Runde setzt genau ein Icon hinzu, den Stern, links neben
            der Lupe — die Reihenfolge der übrigen Icons bleibt unangetastet.
        states:
          - { id: default }
        locators:
          web: "[data-ui-id='UI-FILES-ACTIONBAR']"

      - id: UI-FILES-ADDRESS
        type: nav
        label: Adresszeile
        status: required
        verify: required
        data_source: "das angezeigte Verzeichnis der Sitzung; beim Öffnen aus file_pane_states.lastPath, sonst realpath(\".\")"
        semantic_anchor:
          means: >
            Der Pfad des gerade angezeigten Verzeichnisses als anklickbare Brotkrumen.
            Beim Öffnen einer Datei-Sitzung steht hier das Verzeichnis, in dem dieses Konto
            auf diesem Server mit diesem Benutzer zuletzt war. Gibt es keines, das
            Startverzeichnis des verbundenen Benutzers — für root also /root, nicht /; über
            FTP das PWD der Verbindung. Ist der gemerkte Pfad verschwunden oder nicht lesbar,
            der nächste vorhandene übergeordnete Ordner; im Grenzfall das Startverzeichnis,
            zuletzt /.
          concept: directory_path
          aliases: [cwd, path, breadcrumb, lastPath, currentDirectory]
          not: [filesystem_root, home_directory, bookmark_path, transfer_destination]
          cardinality: one
          unit: text
          example: "/volume1/docker"
          source_of_truth: "READY.path aus server/routes/sftpWS.js; dauerhaft in file_pane_states.lastPath je (accountId, entryId, identityId), fortgeschrieben aus PATH_SYNC"
        states:
          - { id: default }
          - { id: loading, copy: "Verbinde …" }
          - { id: partial, copy: "Zuletzt geöffnet: {gemerkt} — nicht mehr vorhanden. Geöffnet wurde {ersatz}." }
        locators:
          web: "[data-ui-id='UI-FILES-ADDRESS']"

      - id: UI-FILES-FAVORITES-TOGGLE
        type: toggle
        label: Favoriten
        status: required
        verify: required
        data_source: "files.favoritesBarOpen aus den Kontoeinstellungen"
        semantic_anchor:
          means: >
            Blendet die Favoritenleiste ein und aus — ein Stern in der Icon-Gruppe der
            Aktionsleiste, unmittelbar links neben der Lupe. Er merkt sich nichts und legt
            nichts an: er zeigt nur den Streifen. Solange der Streifen offen ist, ist der
            Stern gefüllt und trägt die Akzentfarbe, wie der Suchen-Button es im Bestand
            schon tut. Der Zustand gilt kontoweit, nicht je Sitzung, und überlebt das
            Neuladen. Taste Strg+B.
          concept: favorites_bar_visibility
          aliases: [showFavorites, favoritesBarOpen, toggleBookmarks]
          not: [add_bookmark, mark_folder_as_favorite, search, filter, rating]
          cardinality: one
          unit: enum
          example: "offen / geschlossen"
          source_of_truth: "Account.preferences.files.favoritesBarOpen"
        states:
          - { id: default }
          - { id: selected, copy: "Leiste offen — Stern gefüllt, Akzentfarbe" }
        locators:
          web: "[data-ui-id='UI-FILES-FAVORITES-TOGGLE']"

      - id: UI-FILES-FAVORITES
        type: list
        label: Favoriten
        status: required
        verify: required
        data_source: "GET /api/entries/:entryId/bookmarks — die Bookmarks dieses Kontos für diesen Server, sortiert nach position"
        semantic_anchor:
          means: >
            Die von diesem Konto auf diesem Server gemerkten Verzeichnisse, als eine Zeile
            Chips mit Ordner-Icon und Ordnernamen; der volle Pfad steht im Tooltip. Ein Klick
            springt in den Ordner. Der Chip des gerade angezeigten Verzeichnisses ist in der
            Akzentfarbe hinterlegt. Die Zeile scrollt nicht und bricht nicht um; was nicht
            passt, geht ins Überlauf-Menü. Umsortiert wird per Ziehen oder mit
            Umschalt+Pfeil auf dem fokussierten Chip.
          concept: directory_bookmark
          aliases: [bookmark, favorite, pinnedDirectory, fileBookmark]
          not: [navigation_history, recent_directory, open_tab, server_entry, tag, saved_search]
          cardinality: many
          unit: text
          example: "docker · log · homes · scripts"
          empty_means: "Dieses Konto hat auf diesem Server noch kein Verzeichnis gemerkt."
          source_of_truth: "Tabelle file_bookmarks, eindeutig je (accountId, entryId, pathHash); Anzeige aus name und path, Reihenfolge aus position"
        columns:
          - { key: name, label: Name, anchor: "der Ordnername, standardmäßig der letzte Pfadbestandteil, umbenennbar" }
          - { key: path, label: Pfad, anchor: "der vollständige absolute Pfad auf diesem Server, nur im Tooltip sichtbar" }
        states:
          - { id: default }
          - { id: selected, copy: "der Chip des gerade angezeigten Verzeichnisses" }
          - { id: partial, copy: "mehr Bookmarks als in die Zeile passen — abgeschnitten vor dem ersten nicht passenden Chip" }
          - { id: dragging, copy: "gezogener Chip halbtransparent, Einfügestelle als Strich in der Akzentfarbe" }
          - { id: empty, copy: "Noch keine Favoriten. Rechtsklick auf einen Ordner legt einen an." }
        locators:
          web: "[data-ui-id='UI-FILES-FAVORITES']"

      - id: UI-FILES-FAVORITES-OVERFLOW
        type: action
        label: Weitere Favoriten
        status: required
        verify: required
        data_source: "die Bookmarks aus UI-FILES-FAVORITES, die nicht in die Zeile passen"
        semantic_anchor:
          means: >
            Ein Chevron am rechten Ende der Zeile, das die verdeckten Bookmarks als Menü
            öffnet — in derselben Reihenfolge wie im Balken, mit Ordner-Icon und Namen.
            Es erscheint nur, wenn wirklich etwas verdeckt ist, und verschwindet, sobald
            die Kachel breit genug wird.
          concept: directory_bookmark
          aliases: [overflow, moreBookmarks, hiddenFavorites]
          not: [more_actions_menu, chip_context_menu, pagination, sort_menu]
          cardinality: many
          unit: text
          example: "backup · vm · media"
          empty_means: "Alle Bookmarks passen in die Zeile — das Chevron fehlt dann ganz."
          source_of_truth: "Ergebnis der Breitenmessung über file_bookmarks, keine eigene Abfrage"
        states:
          - { id: default, copy: "Chevron sichtbar, Menü zu" }
          - { id: selected, copy: "Menü offen" }
        locators:
          web: "[data-ui-id='UI-FILES-FAVORITES-OVERFLOW']"

      - id: UI-FILES-FAVORITE-MENU
        type: overlay
        label: Favoriten-Kontextmenü
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: >
            Rechtsklick auf einen Chip: Umbenennen und Entfernen. Umbenennen ersetzt die
            Beschriftung des Chips an Ort und Stelle durch ein Eingabefeld, wie die
            Dateiliste es beim Umbenennen einer Datei schon tut. Entfernen fragt nicht nach —
            ein Bookmark ist mit einem Rechtsklick wieder angelegt, und der Ordner selbst
            bleibt unangetastet.
          not: [delete_folder, file_context_menu, overflow_menu]
        states:
          - { id: default }
          - { id: selected, copy: "Umbenennen aktiv — Eingabefeld im Chip, Enter bestätigt, Esc verwirft" }
        locators:
          web: "[data-ui-id='UI-FILES-FAVORITE-MENU']"

      - id: UI-FILES-LIST
        type: list
        label: Dateien
        status: required
        verify: recommended
        data_source: "LIST_FILES über den SFTP-WebSocket für das angezeigte Verzeichnis"
        semantic_anchor:
          means: >
            Bestand: der Inhalt des angezeigten Verzeichnisses — Ordner zuerst, dann
            Dateien, mit Name, Größe, Änderungsdatum und Rechten, in drei Ansichtsarten.
            Diese Runde ändert daran nichts außer den beiden Kontextmenü-Einträgen.
          concept: file_entry
          aliases: [file, folder, directoryEntry, listing]
          not: [directory_bookmark, server_entry, transfer, search_result]
          cardinality: many
          unit: text
          example: "docker · homes · scripts · docker-compose.yml"
          empty_means: "Das Verzeichnis ist leer."
          source_of_truth: "SFTP-Listing der aktiven Sitzung"
        states:
          - { id: default }
          - { id: loading }
          - { id: empty }
          - { id: error }
        locators:
          web: "[data-ui-id='UI-FILES-LIST']"

      - id: UI-FILES-LIST-MENU
        type: overlay
        label: Kontextmenü der Dateiliste
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: >
            Rechtsklick auf einen Eintrag. Bestand: Umbenennen, Vorschau und Bearbeiten
            (nur Dateien), Herunterladen, Pfad kopieren, Eigenschaften, Terminal hier öffnen
            (nur Ordner), Löschen. Neu und ausschließlich bei Ordnern: "Als Bookmark
            anlegen", das den angeklickten Ordner merkt — nicht das angezeigte Verzeichnis.
            Ist der Ordner schon gemerkt, steht an derselben Stelle "Bookmark entfernen".
          not: [empty_area_menu, favorite_context_menu, drop_menu]
        states:
          - { id: default, copy: "Als Bookmark anlegen" }
          - { id: selected, copy: "Bookmark entfernen" }
          - { id: disabled, copy: "bei Dateien fehlt der Eintrag ganz" }
        locators:
          web: "[data-ui-id='UI-FILES-LIST-MENU']"

      - id: UI-FILES-EMPTY-MENU
        type: overlay
        label: Kontextmenü der freien Fläche
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: >
            Rechtsklick auf die freie Fläche unter den Einträgen. Bestand: Neue Datei,
            Neuer Ordner, Trenner, Ordner herunterladen, Eigenschaften, Terminal hier öffnen.
            Neu: "Diesen Ordner als Bookmark", das das gerade angezeigte Verzeichnis merkt —
            nicht einen darin liegenden Ordner. Ist es schon gemerkt, steht dort
            "Bookmark entfernen".
          not: [item_context_menu, favorite_context_menu, drop_menu]
        states:
          - { id: default, copy: "Diesen Ordner als Bookmark" }
          - { id: selected, copy: "Bookmark entfernen" }
        locators:
          web: "[data-ui-id='UI-FILES-EMPTY-MENU']"

  - id: UI-SERVER-DIALOG
    kind: dialog
