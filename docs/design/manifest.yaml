        type: action
        label: Bearbeiten · Löschen
        status: required
        verify: required
        data_source: static
        semantic_anchor:
          means: Bearbeiten öffnet den Eintrag-Dialog; Löschen fragt im Bestätigungsdialog nach und entfernt den Eintrag samt Werten und Bindungen. Nur mit Verwaltungsrecht (Besitzer persönlicher Einträge, vault.manage bei Organisationen); ohne das Recht nicht sichtbar.
          not: [vault_secret]
        states:
          - { id: default }
          - { id: disabled, copy: "ohne Verwaltungsrecht nicht sichtbar" }
          - { id: selected, copy: "portal-login löschen? Agenten verlieren den Zugriff sofort." }
        locators:
          web: "[data-ui-id='UI-VAULT-DETAIL-ACTIONS']"

      - id: UI-VAULT-DETAIL-FIELDS
        type: region
        label: Angaben
        status: required
        verify: required
        data_source: "fields des Eintrags je Typ"
        semantic_anchor:
          means: Die nicht geheimen Angaben des Eintrags je Typ — Login Benutzer und erlaubte Ursprünge, API-Key Hosts und Header, SSH Benutzer, Datenbank Engine, Host, Port, Datenbank, Benutzer.
          concept: vault_item_fields
          not: [vault_secret]
          example: "Benutzer ma.backes · Ursprünge https://portal.example.com"
        states:
          - { id: default }
        locators:
          web: "[data-ui-id='UI-VAULT-DETAIL-FIELDS']"

      - id: UI-VAULT-DETAIL-SECRET
        type: field
        label: Geheimer Wert
        status: required
        verify: required
        data_source: "GET /api/vault/items/:id/secrets/:field, erst beim Klick auf Anzeigen oder Kopieren"
        semantic_anchor:
          means: >
            Je geheimem Feld eine Zeile mit genau zwölf Punkten, unabhängig von der Länge des
            Werts. Anzeigen und Kopieren nur für den Besitzer persönlicher Einträge oder mit
            vault.reveal, nie in einer Impersonations-Sitzung; sonst der Hinweis, dass der Wert
            nur für Agenten nutzbar ist. Ein angezeigter Wert verbirgt sich nach 30 Sekunden.
          concept: vault_secret
          aliases: [password, token, private_key]
          not: [vault_item_fields, identity]
          example: "Passwort ••••••••••••"
        states:
          - { id: default }
          - { id: selected, copy: "angezeigt, verbirgt sich in 30 s" }
          - { id: disabled, copy: "nur für Agenten nutzbar" }
          - { id: success, copy: "Kopiert" }
        locators:
          web: "[data-ui-id='UI-VAULT-DETAIL-SECRET']"

      - id: UI-VAULT-DETAIL-SCOPE
        type: list
        label: Gilt für
        status: required
        verify: required
        data_source: "vault_bindings des Eintrags und allServers"
        semantic_anchor:
          means: Für welche Server Agenten diesen Eintrag sehen — einzelne Server, Ordner mit Unterordnern, Tags oder alle Server.
          concept: vault_binding
          aliases: [binding, scope]
          not: [vault_owner, permission]
          cardinality: many
          example: "Server web01 · Ordner Produktion · Tag db"
          empty_means: Kein Agent sieht den Eintrag — Hinweis, dass er erst nach einer Freigabe für Server nutzbar ist.
        states:
          - { id: default }
          - { id: empty, copy: "Für keinen Server freigegeben — kein Agent sieht diesen Eintrag." }
        locators:
          web: "[data-ui-id='UI-VAULT-DETAIL-SCOPE']"

      - id: UI-VAULT-DETAIL-POLICY
        type: status
        label: Freigabe erforderlich
        status: required
        verify: required
        data_source: "approvalRequired und lastUsedAt des Eintrags"
        semantic_anchor:
          means: Ob jede Nutzung durch einen Agenten bestätigt werden muss, und wann der Eintrag zuletzt genutzt wurde.
          concept: approval_policy
          not: [permission, vault_binding]
          example: "Freigabe erforderlich · zuletzt genutzt vor 2 Stunden"
        states:
          - { id: default }
          - { id: disabled, copy: "Ohne Freigabe nutzbar" }
        locators:
          web: "[data-ui-id='UI-VAULT-DETAIL-POLICY']"

  - id: UI-VAULT-DIALOG
