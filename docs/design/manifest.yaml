    description: Ein Formular, dessen Felder sich nach dem Typ richten; Geltung und Freigabe kompakt darunter.
    elements:
      - id: UI-VAULT-DIALOG-TYPE
        type: field
        label: Typ
        status: required
        verify: required
        data_source: static
        semantic_anchor:
