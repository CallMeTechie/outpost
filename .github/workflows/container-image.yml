name: Container Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish. Defaults to a throwaway tag so a manual build of a lower stack layer cannot overwrite the deployed :latest image."
        required: false
        default: test
  push:
    # Only main. Every feature branch is an ancestor of it, so a push there
    # would publish an older tree under the same mutable tag.
    branches: [main]

# A stack rebase force-pushes several layers at once, and the older layers
# still carry their own copy of this file with their own branch listed. Same
# tag, same group: the last one started wins instead of the last one finished.
concurrency:
  group: container-image-${{ github.event.inputs.tag || 'latest' }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  TAG: ${{ github.event.inputs.tag || 'latest' }}

jobs:
  components:
    name: "Build ${{ matrix.slug }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: server
            dockerfile: Dockerfile.server
          - slug: engine
            dockerfile: Dockerfile.engine

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Dockerfile.server writes this into the image's own package.json, so a
      # pinned value is what the running server then reports about itself - it
      # read 0.1.0 for every build since that release. Taken from the tree being
      # built, which is the only source that cannot drift.
      - name: Read the project version
        id: version
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/outpost-${{ matrix.slug }}:${{ env.TAG }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}-${{ env.TAG }}
          cache-from: type=gha,scope=image-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.slug }}

  aio:
    name: "Build all-in-one"
    needs: components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/outpost:${{ env.TAG }}
          build-args: |
            SERVER_IMAGE=${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/outpost-server:${{ env.TAG }}
            ENGINE_IMAGE=${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/outpost-engine:${{ env.TAG }}
          cache-from: type=gha,scope=image-aio
          cache-to: type=gha,mode=max,scope=image-aio
