name: Build Connector

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      semver:
        required: true
        type: string
      upload_url:
        required: true
        type: string

jobs:
  build-windows:
    name: "Windows (${{ matrix.arch }} ${{ matrix.format }})"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            format: msi
            artifact_path: connector/src-tauri/target/release/bundle/msi/*.msi
            artifact_name: outpost-connector-windows-x64.msi
            updater_key: outpost-connector-windows-x64.msi
          - arch: x64
            target: x86_64-pc-windows-msvc
            format: exe
            artifact_path: connector/src-tauri/target/release/bundle/nsis/*.exe
            artifact_name: outpost-connector-windows-x64.exe
            updater_key: outpost-connector-windows-x64.exe
          - arch: arm64
            target: aarch64-pc-windows-msvc
            format: exe
            artifact_path: connector/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
            artifact_name: outpost-connector-windows-arm64.exe
            updater_key: outpost-connector-windows-arm64.exe

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Update connector versions
        shell: bash
        run: |
          VERSION="${{ inputs.semver }}"
          cd connector && npm pkg set version="$VERSION" && cd ..
          cd connector/src-tauri
          jq ".version = \"$VERSION\"" tauri.conf.json > tmp.json && mv tmp.json tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Install client dependencies
        working-directory: client
        run: |
          npm install -g yarn
          yarn install

      - name: Build client
        working-directory: client
        run: yarn build

      - name: Install connector dependencies
        working-directory: connector
        run: |
          npm install -g yarn
          yarn install

      - name: Build Connector
        working-directory: connector
        run: yarn tauri build ${{ matrix.arch == 'arm64' && format('--target {0}', matrix.target) || '' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Find artifact
        id: find_artifact
        shell: bash
        run: |
          ARTIFACT=$(ls ${{ matrix.artifact_path }} 2>/dev/null | head -1)
          echo "artifact_file=$ARTIFACT" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ${{ steps.find_artifact.outputs.artifact_file }}
          asset_name: ${{ matrix.artifact_name }}
          asset_content_type: application/octet-stream

      - name: Rename signature to its canonical asset name
        if: matrix.updater_key != ''
        shell: bash
        run: cp "${{ steps.find_artifact.outputs.artifact_file }}.sig" "${{ matrix.updater_key }}.sig"

      - name: Upload signature
        if: matrix.updater_key != ''
        uses: actions/upload-artifact@v4
        with:
          name: updater-sig-${{ matrix.updater_key }}
          # The basename inside the artifact must equal ASSETS[key] in
          # build-updater-manifest.js, not Tauri's productName-derived name.
          path: ${{ matrix.updater_key }}.sig
          if-no-files-found: error

  build-macos:
    name: "macOS (${{ matrix.arch }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-apple-darwin
            artifact_path: connector/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            artifact_name: outpost-connector-macos-x64.dmg
            updater_path: connector/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
            updater_name: outpost-connector-macos-x64.app.tar.gz
            updater_key: outpost-connector-macos-x64.app.tar.gz
          - arch: arm64
            target: aarch64-apple-darwin
            artifact_path: connector/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            artifact_name: outpost-connector-macos-arm64.dmg
            updater_path: connector/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            updater_name: outpost-connector-macos-arm64.app.tar.gz
            updater_key: outpost-connector-macos-arm64.app.tar.gz

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Update connector versions
        run: |
          VERSION="${{ inputs.semver }}"
          cd connector && npm pkg set version="$VERSION" && cd ..
          cd connector/src-tauri
          jq ".version = \"$VERSION\"" tauri.conf.json > tmp.json && mv tmp.json tauri.conf.json
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Install client dependencies
        working-directory: client
        run: |
          npm install -g yarn
          yarn install

      - name: Build client
        working-directory: client
        run: yarn build

      - name: Install connector dependencies
        working-directory: connector
        run: |
          npm install -g yarn
          yarn install

      - name: Build Connector
        working-directory: connector
        run: yarn tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Find artifact
        id: find_artifact
        run: |
          ARTIFACT=$(ls ${{ matrix.artifact_path }} 2>/dev/null | head -1)
          echo "artifact_file=$ARTIFACT" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ${{ steps.find_artifact.outputs.artifact_file }}
          asset_name: ${{ matrix.artifact_name }}
          asset_content_type: application/octet-stream

      - name: Find updater artifact
        id: find_updater
        run: |
          ARTIFACT=$(ls ${{ matrix.updater_path }} 2>/dev/null | head -1)
          if [ -z "$ARTIFACT" ]; then echo "no updater artifact at ${{ matrix.updater_path }}"; exit 1; fi
          echo "updater_file=$ARTIFACT" >> $GITHUB_OUTPUT

      - name: Upload updater artifact to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ${{ steps.find_updater.outputs.updater_file }}
          asset_name: ${{ matrix.updater_name }}
          asset_content_type: application/octet-stream

      - name: Rename signature to its canonical asset name
        shell: bash
        run: cp "${{ steps.find_updater.outputs.updater_file }}.sig" "${{ matrix.updater_key }}.sig"

      - name: Upload signature
        uses: actions/upload-artifact@v4
        with:
          name: updater-sig-${{ matrix.updater_key }}
          path: ${{ matrix.updater_key }}.sig
          if-no-files-found: error

  build-linux:
    name: "Linux (${{ matrix.format }})"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            artifact_path: connector/src-tauri/target/release/bundle/deb/*.deb
            artifact_name: outpost-connector-linux-x64.deb
          - format: rpm
            artifact_path: connector/src-tauri/target/release/bundle/rpm/*.rpm
            artifact_name: outpost-connector-linux-x64.rpm
          - format: AppImage
            artifact_path: connector/src-tauri/target/release/bundle/appimage/*.AppImage
            artifact_name: outpost-connector-linux-x64.AppImage
            updater_key: outpost-connector-linux-x64.AppImage

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        timeout-minutes: 45
        run: |
          set -uo pipefail
          # A healthy run finishes in ~5 minutes; a bad apt mirror can stall for hours.
          # The retry here catches a single attempt that stalls or gets killed; it
          # does NOT get you a different mirror (the mirror list in
          # /etc/apt/apt-mirrors.txt belongs to the runner, so all three attempts on
          # the same runner hit largely the same source). Against a mirror that is
          # persistently slow, it's the generous per-attempt timeout that saves you,
          # not the attempt count.
          #
          # IMPORTANT, learned the hard way in production (release v0.1.1): timeout
          # must run under sudo, not the other way round. "timeout ... bash -c 'sudo
          # apt-get ...'" runs timeout as an unprivileged process whose direct child
          # is bash, not apt-get; sudo's apt-get is root-owned and unprivileged
          # timeout cannot signal it, so SIGTERM and even SIGKILL land on nothing and
          # apt-get survives untouched. That is exactly what happened: attempt 1 hit
          # the timeout but apt-get kept running and kept holding the dpkg frontend
          # lock, so attempts 2 and 3 failed instantly with "could not get lock"
          # instead of getting a real retry. The fix is "sudo timeout ... apt-get",
          # one call per apt invocation, so timeout's direct child is the privileged
          # apt-get it is actually allowed to kill. Do not "simplify" this back to
          # timeout-wraps-sudo; it silently defeats the whole retry mechanism.
          max_attempts=3
          update_timeout=300  # 5 minutes: package list fetch on a slow mirror
          install_timeout=480 # 8 minutes: actual package install
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Install attempt $attempt of $max_attempts"
            if sudo timeout --kill-after=10 "$update_timeout" apt-get update && \
               sudo timeout --kill-after=10 "$install_timeout" apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev; then
              echo "Linux dependencies installed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed or timed out"
            if [ "$attempt" -lt "$max_attempts" ]; then
              # A killed attempt can still leave an apt-get/dpkg survivor holding
              # the dpkg lock; clear it before the next attempt so the retry has
              # an actual chance instead of failing immediately on the lock.
              echo "Cleaning up before retry"
              sudo pkill -9 -x apt-get || true
              sudo pkill -9 -x dpkg || true
              sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock || true
              sudo dpkg --configure -a || true
              sleep 15
            fi
          done
          echo "Failed to install Linux dependencies after $max_attempts attempts"
          exit 1

      - name: Update connector versions
        run: |
          VERSION="${{ inputs.semver }}"
          cd connector && npm pkg set version="$VERSION" && cd ..
          cd connector/src-tauri
          jq ".version = \"$VERSION\"" tauri.conf.json > tmp.json && mv tmp.json tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Install client dependencies
        working-directory: client
        run: |
          npm install -g yarn
          yarn install

      - name: Build client
        working-directory: client
        run: yarn build

      - name: Install connector dependencies
        working-directory: connector
        run: |
          npm install -g yarn
          yarn install

      - name: Build Connector
        working-directory: connector
        run: yarn tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Find artifact
        id: find_artifact
        run: |
          ARTIFACT=$(ls ${{ matrix.artifact_path }} 2>/dev/null | head -1)
          echo "artifact_file=$ARTIFACT" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ${{ steps.find_artifact.outputs.artifact_file }}
          asset_name: ${{ matrix.artifact_name }}
          asset_content_type: application/octet-stream

      - name: Rename signature to its canonical asset name
        if: matrix.updater_key != ''
        shell: bash
        run: cp "${{ steps.find_artifact.outputs.artifact_file }}.sig" "${{ matrix.updater_key }}.sig"

      - name: Upload signature
        if: matrix.updater_key != ''
        uses: actions/upload-artifact@v4
        with:
          name: updater-sig-${{ matrix.updater_key }}
          # The basename inside the artifact must equal ASSETS[key] in
          # build-updater-manifest.js, not Tauri's productName-derived name.
          path: ${{ matrix.updater_key }}.sig
          if-no-files-found: error
