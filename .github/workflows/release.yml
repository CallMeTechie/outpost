name: Release

on:
  push:
    tags: ["v*"]

# A new repository defaults the GITHUB_TOKEN to read-only. Creating the release,
# uploading assets and pushing the version bump all need write access, and the
# reusable workflows called below inherit what is granted here.
permissions:
  contents: write

jobs:
  create-release:
    name: "Create Release"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      semver: ${{ steps.get_version.outputs.semver }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          SEMVER=$(echo "$VERSION" | sed 's/-.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.get_version.outputs.version }}
          draft: true
          # A hyphen in the version is what semver calls a pre-release.
          # Tags like v0.0.2-test or v1.2.2-BETA must never become the
          # "latest" release the connector's updater reads from.
          prerelease: ${{ contains(github.ref_name, '-') }}

  build-cli:
    name: "Build CLI"
    needs: create-release
    uses: ./.github/workflows/build-cli.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      semver: ${{ needs.create-release.outputs.semver }}
      upload_url: ${{ needs.create-release.outputs.upload_url }}
    secrets: inherit

  build-mobile:
    name: "Build Mobile"
    needs: create-release
    uses: ./.github/workflows/build-mobile.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      semver: ${{ needs.create-release.outputs.semver }}
      upload_url: ${{ needs.create-release.outputs.upload_url }}
    secrets: inherit

  build-server:
    name: "Build Server"
    needs: create-release
    uses: ./.github/workflows/build-server.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      semver: ${{ needs.create-release.outputs.semver }}
      upload_url: ${{ needs.create-release.outputs.upload_url }}
    secrets: inherit

  build-engine:
    name: "Build Engine"
    needs: create-release
    uses: ./.github/workflows/build-engine.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      semver: ${{ needs.create-release.outputs.semver }}
      upload_url: ${{ needs.create-release.outputs.upload_url }}
    secrets: inherit

  build-connector:
    name: "Build Connector"
    needs: create-release
    uses: ./.github/workflows/build-connector.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      semver: ${{ needs.create-release.outputs.semver }}
      upload_url: ${{ needs.create-release.outputs.upload_url }}
    secrets: inherit

  updater-manifest:
    name: "Updater Manifest"
    # Inline job, not a reusable-workflow call: `secrets: inherit` does not
    # apply here. Only secrets.GITHUB_TOKEN is used below; the signing key
    # stays scoped to the build-connector jobs that actually sign.
    runs-on: ubuntu-latest
    needs: [create-release, build-connector]
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect signatures
        uses: actions/download-artifact@v4
        with:
          pattern: updater-sig-*
          merge-multiple: true
          path: signatures

      - name: Build manifest
        run: node scripts/build-updater-manifest.js "${{ needs.create-release.outputs.version }}" signatures latest.json

      - name: Upload manifest to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: latest.json
          asset_name: latest.json
          asset_content_type: application/json

  finalize-release:
    name: "Finalize Release"
    needs: [create-release, build-cli, build-mobile, build-server, build-engine, build-connector, updater-manifest]
    uses: ./.github/workflows/finalize-release.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      semver: ${{ needs.create-release.outputs.semver }}
      release_id: ${{ needs.create-release.outputs.release_id }}
    secrets: inherit

  cleanup-on-failure:
    name: "Cleanup on Failure"
    runs-on: ubuntu-latest
    needs: [create-release, build-cli, build-mobile, build-server, build-engine, build-connector, updater-manifest]
    if: failure()
    steps:
      - name: Delete release
        # create-release itself can fail, leaving release_id empty. The value is
        # interpolated straight into the script below, so an empty one is a
        # syntax error rather than a no-op.
        if: needs.create-release.outputs.release_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: ${{ needs.create-release.outputs.release_id }}
              });
              console.log('Release deleted');
            } catch (e) {
              console.log('Failed to delete release:', e.message);
            }

      - name: Delete tag
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/${{ github.ref_name }}'
              });
              console.log('Tag deleted');
            } catch (e) {
              console.log('Failed to delete tag:', e.message);
            }
