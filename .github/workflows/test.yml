name: Test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: "Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            client/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install client dependencies
        working-directory: client
        run: yarn install --frozen-lockfile

      - name: Install FlatBuffers compiler
        run: |
          curl -fsSL -o /tmp/flatc.zip \
            https://github.com/google/flatbuffers/releases/download/v23.5.26/Linux.flatc.binary.g++-10.zip
          sudo unzip -o /tmp/flatc.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/flatc
          flatc --version

      - name: Generate protocol modules
        run: yarn schema:generate

      - name: Run tests
        run: yarn test
