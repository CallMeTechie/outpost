name: Lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: "Server"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint the server sources
        run: yarn lint

  client:
    name: "Client (changed files)"
    runs-on: ubuntu-latest

    steps:
      # The full client tree carries pre-existing findings that are not this
      # gate's business. Only what a branch actually changed is checked, so the
      # debt stops growing without having to be paid off first. Full history is
      # needed for the merge base below.
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect the changed client files
        id: changed
        run: |
          # Three dots: compare against the common ancestor, not against the tip
          # of main. Without it, unrelated work on main counts as changed here
          # as soon as the branch falls behind.
          #
          # -z / -0 throughout: a file name may contain spaces, quotes or
          # backslashes. Newline-separated lists break on all three, and git
          # additionally C-quotes such names, which would defeat the prefix
          # strip. NUL separation is the only form that survives every legal
          # POSIX name.
          #
          # --diff-filter=d (lowercase) excludes deletions; without it eslint
          # aborts on a path that no longer exists.
          #
          # Both 'client/*.js' and 'client/**/*.js' are listed: without glob
          # pathspec magic, git's ** requires at least one directory segment,
          # so it never matches files directly under client/ (eslint.config.js,
          # vite.config.js). The plain 'client/*.js' pattern covers that gap.
          git diff -z --name-only --diff-filter=d origin/main...HEAD \
            -- 'client/*.js' 'client/**/*.js' 'client/**/*.jsx' \
            | sed -z 's|^client/||' > "$RUNNER_TEMP/changed-client-files"

          if [ -s "$RUNNER_TEMP/changed-client-files" ]; then
            echo "Changed client files:"
            tr '\0' '\n' < "$RUNNER_TEMP/changed-client-files"
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "No client sources changed - skipping."
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.changed.outputs.any == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: Install client dependencies
        if: steps.changed.outputs.any == 'true'
        working-directory: client
        run: yarn install --frozen-lockfile

      # The trailing -- tells eslint to treat everything after it as a path.
      # With 'client/*.js' in the collected pathspec, a file directly under
      # client/ is no longer forced to carry a directory segment in front of
      # its name, so a dash-prefixed file is a real possibility, not just a
      # theoretical one - and eslint reads --config=FILE as a module to import
      # and execute.
      - name: Lint the changed files
        if: steps.changed.outputs.any == 'true'
        working-directory: client
        run: xargs -0 -a "$RUNNER_TEMP/changed-client-files" -- npx eslint --
